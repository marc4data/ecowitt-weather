[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ecowitt-discovery"
version = "0.0.0"
description = "Phase 0 discovery tooling for the Ecowitt weather data pipeline"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "python-dotenv>=1.0",
    "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    # Parse-checks schema/*.sql. No Postgres is available locally, so this is
    # syntax validation only -- it is not a substitute for executing the DDL.
    "sqlglot>=25.0",
]
# The daily email. It imports notebooks/ecowitt_daily.py (thresholds) and
# notebooks/ecowitt_nb.py (fetching, palette, chart styling) rather than
# reimplementing either, so it needs what those need -- which is why this
# overlaps `notebook` rather than being independent of it.
#
# ⚠️ DEPLOYMENT CONSEQUENCE: the VM currently installs only the base package,
# whose sole dependency stack is psycopg. Running the report there means
# `pip install -e '.[report]'` and shipping notebooks/*.py alongside src/ --
# see infra/deploy_report.sh.
report = [
    "pandas>=2.0",
    "sqlalchemy>=2.0",
    "matplotlib>=3.8",
    "psycopg[binary]>=3.1",
    # Claude writes the opening of an ACTION email in plain English (§6.3).
    # Listed here, but `reporting.triage` still imports it lazily inside a
    # try/except: a broken install must cost the prose, never the email.
    "anthropic>=0.40",
]
# Exploration only -- nothing in src/ingest or src/discovery imports these.
# sqlalchemy and matplotlib are here because notebooks/explore.ipynb imports
# them; without them a fresh `pip install -e '.[notebook]'` gets a notebook
# that fails on its first cell.
notebook = [
    "pandas>=2.0",
    "jupyter>=1.0",
    "ipykernel>=6.0",
    "sqlalchemy>=2.0",
    "matplotlib>=3.8",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# UP017 rewrites `timezone.utc` to the `datetime.UTC` alias. Both project docs
# state the rule literally as `tz=timezone.utc` (PHASE0 §11, CLAUDE.md §5.3),
# and matching the written guardrail is worth more here than the alias.
ignore = ["UP017"]

[tool.pytest.ini_options]
testpaths = ["tests"]
